<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokémon Skirmish Arena</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
<section id="menu" class="screen menu" aria-label="Main menu">
    <header class="logo">
        <span class="logo-ball" aria-hidden="true"></span>
        <h1 class="menu-title">Pokémon <em>Skirmish</em> Arena</h1>
        <p class="logo-tag">A tactical card battle for legendary trainers</p>
    </header>
    <form id="play-form" class="menu-play">
        <div class="setup-columns">
            <div class="panel setup">
                <h2><span class="tag tag--you">You</span> Choose your Hero</h2>
                <div class="choice-grid choice-grid--hero" data-choice="hero" data-name="humanHero" data-default="zapdos"></div>
                <h3>Deck</h3>
                <div class="choice-grid choice-grid--deck" data-choice="deck" data-name="humanDeck" data-default="AGGRO"></div>
            </div>
            <div class="versus" aria-hidden="true">VS</div>
            <div class="panel setup">
                <h2><span class="tag tag--ai">AI</span> Choose the opponent</h2>
                <div class="choice-grid choice-grid--hero" data-choice="hero" data-name="aiHero" data-default="articuno"></div>
                <h3>Deck</h3>
                <div class="choice-grid choice-grid--deck" data-choice="deck" data-name="aiDeck" data-default="CONTROL"></div>
                <h3>Strategy</h3>
                <div class="choice-grid choice-grid--bot" data-choice="bot" data-name="aiBot" data-default="Defensive"></div>
            </div>
        </div>
        <div class="menu-actions">
            <label class="seed">Seed <input name="seed" inputmode="numeric" placeholder="random"></label>
            <button type="submit" class="primary primary--hero">▶ Play</button>
            <button type="button" id="open-simulation" class="secondary-btn">⚙ Simulation mode</button>
        </div>
    </form>
    <p id="menu-error" class="error" role="alert"></p>
</section>

<section id="simulation" class="screen simulation" aria-label="Simulation" hidden>
    <button type="button" class="back" data-back>← Menu</button>
    <form id="simulation-form" class="panel sim-form">
        <h2>AI vs AI Simulation</h2>
        <p class="panel-hint">Bots play many matches; the first one can be replayed.</p>
        <fieldset>
            <legend>Player 1</legend>
            <label>Hero <select name="p1Hero" data-options="hero" data-default="zapdos"></select></label>
            <label>Deck <select name="p1Deck" data-options="deck" data-default="AGGRO"></select></label>
            <label>Bot <select name="p1Bot" data-options="bot" data-default="Aggressive"></select></label>
        </fieldset>
        <fieldset>
            <legend>Player 2</legend>
            <label>Hero <select name="p2Hero" data-options="hero" data-default="articuno"></select></label>
            <label>Deck <select name="p2Deck" data-options="deck" data-default="CONTROL"></select></label>
            <label>Bot <select name="p2Bot" data-options="bot" data-default="Defensive"></select></label>
        </fieldset>
        <label>Matches <input name="matches" type="number" min="1" max="10000" value="100" required></label>
        <label>Seed <input name="seed" inputmode="numeric" placeholder="random"></label>
        <button type="submit" class="primary">Start Simulation</button>
    </form>
    <div id="simulation-results" class="panel sim-results"></div>
    <div id="replay" class="panel replay" hidden></div>
</section>

<main id="battle" class="arena" hidden>
    <section class="side side--opponent" aria-label="Opponent">
        <div class="hero-row">
            <div id="opponent-hero"></div>
            <div class="hero-info">
                <div id="opponent-mana" class="mana"></div>
                <div id="opponent-hand" class="opponent-hand" aria-label="Opponent hand"></div>
                <div id="opponent-piles" class="piles"></div>
            </div>
            <div id="opponent-power"></div>
        </div>
        <div id="opponent-board" class="board" aria-label="Opponent Board"></div>
    </section>

    <section class="battlefield-divider" aria-label="Turn">
        <button type="button" class="back" data-back>← Menu</button>
        <div id="turn-indicator" class="turn-indicator"></div>
        <button id="end-turn" class="end-turn" type="button">End Turn</button>
    </section>

    <section class="side side--player" aria-label="Player">
        <div id="player-board" class="board" aria-label="Your Board"></div>
        <div class="hero-row">
            <div id="player-hero"></div>
            <div class="hero-info">
                <div id="player-mana" class="mana"></div>
                <div id="player-piles" class="piles"></div>
            </div>
            <div id="player-power"></div>
        </div>
        <div id="player-hand" class="hand" aria-label="Your hand"></div>
    </section>

    <aside id="action-log" class="action-log" aria-live="polite"></aside>
</main>

<div id="picker" class="picker" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
