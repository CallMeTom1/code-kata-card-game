<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Tests</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 20px; background: #120c07; color: #f3e9d2; font: 15px/1.4 Consolas, monospace; }
    h1 { font-family: Georgia, serif; color: #f4d58d; margin: 0 0 6px; }
    .summary { font-size: 18px; margin: 0 0 14px; padding: 8px 12px; border-radius: 8px; }
    .summary.ok { background: #0f3d1a; border: 1px solid #0ca30c; }
    .summary.ko { background: #4a1210; border: 1px solid #d03b3b; }
    ol { padding-left: 0; list-style: none; }
    li { padding: 3px 0; overflow-wrap: anywhere; }
    .pass::before { content: "✔ "; color: #0ca30c; }
    .fail::before { content: "✘ "; color: #d03b3b; }
    .fail { color: #ffb3b3; }
    .error { display: block; color: #c8b89a; margin-left: 22px; }
  </style>
</head>
<body>
  <h1>Front-end tests</h1>
  <p class="summary" id="summary">Running…</p>
  <ol id="results"></ol>

  <script src="tests/harness.js"></script>
  <script src="data/sample-match.js"></script>
  <script src="tests/expected-log.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/replay.js"></script>
  <script src="js/logformat.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/themes.js"></script>
  <script src="tests/replay.test.js"></script>
  <script src="tests/logformat.test.js"></script>
  <script src="tests/stats.test.js"></script>
  <script src="tests/sound.test.js"></script>
  <script src="tests/visuals.test.js"></script>
  <script src="tests/themes.test.js"></script>
  <script src="tests/i18n.test.js"></script>
  <script>
    if (!window.Arena || !window.Arena.Test) {
      document.getElementById("summary").textContent = "The scripts could not be loaded. Open web/tests.html "
        + "in Chrome, Edge or Firefox from the project folder (not in a preview).";
      document.getElementById("summary").className = "summary ko";
      throw new Error("Arena scripts not loaded");
    }
    const results = Arena.Test.run();
    const failed = results.filter((r) => !r.passed).length;
    const summary = document.getElementById("summary");
    summary.textContent = `${results.length - failed} passed, ${failed} failed`;
    summary.className = "summary " + (failed ? "ko" : "ok");
    document.title = (failed ? "✘ " : "✔ ") + "Arena Tests";
    document.getElementById("results").innerHTML = results.map((r) =>
      `<li class="${r.passed ? "pass" : "fail"}">${r.name}${r.passed ? "" : `<span class="error">${r.error.replace(/</g, "&lt;")}</span>`}</li>`).join("");
  </script>
</body>
</html>
